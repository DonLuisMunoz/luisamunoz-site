<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · Add a project</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
  <style>
    .admin { max-width: 760px; margin: 0 auto; padding: 6vh 5vw; }
    .admin .field { margin-bottom: 16px; }
    .admin .field label { color: var(--text-soft); }
    .admin .field input, .admin .field textarea {
      background: var(--paper); border: 3px solid var(--plum); color: var(--plum);
    }
    .admin .field input:focus, .admin .field textarea:focus { border-color: var(--gold); }
    .admin-list .card { margin-bottom: 16px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
    .row > .field { flex: 1; min-width: 180px; }
    .danger { background: var(--danger); color: var(--cream); border-color: var(--plum); }
    /* Status line on a light surface. The shared .form-status is gold, built
       for the plum contact panel, and would fail at 1.69:1 here. State
       colours both clear AA on cream: success 5.13, danger 4.58. */
    .admin .form-status { color: var(--text-soft); }
    .admin .form-status.is-ok { color: var(--success); }
    .admin .form-status.is-error { color: var(--danger); }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="nav">
    <a href="./index.html" class="nav__brand">
      <span class="nav__mark">&gt;_</span>
      <span class="nav__wordmark">luis<span class="dot">.</span>admin</span>
    </a>
    <a href="./index.html" class="nav__cta">view site ↗</a>
  </nav>

  <main id="main">

  <div class="admin">
    <div class="section__head">
      <div class="section-kicker">// admin</div>
      <h1 class="section-title">Add a project</h1>
      <p class="section-lead">New entries appear in the learning log instantly. Paste your admin token once to unlock.</p>
    </div>

    <div class="field">
      <label for="token">Admin token</label>
      <input id="token" type="password" placeholder="ADMIN_TOKEN from your backend .env">
    </div>

    <form id="project-form" class="nb-block" style="padding:24px;background:var(--paper);">
      <input type="hidden" id="f-id">
      <div class="row">
        <div class="field">
          <label for="f-title">Title</label>
          <input id="f-title" type="text" required placeholder="Cheat Code Scanner">
        </div>
        <div class="field">
          <label for="f-meta">Meta line</label>
          <input id="f-meta" type="text" placeholder="2026 · LOG #05">
        </div>
      </div>
      <div class="field">
        <label for="f-body">Description</label>
        <textarea id="f-body" rows="3" required placeholder="What you built and the lesson that stuck."></textarea>
      </div>
      <div class="row">
        <div class="field">
          <label for="f-tools">Tools — drives the stack bars (comma-separated)</label>
          <input id="f-tools" type="text" placeholder="SQL, PostgreSQL, Python">
        </div>
        <div class="field">
          <label for="f-tags">Tags — card labels only (comma-separated)</label>
          <input id="f-tags" type="text" placeholder="loops, conditionals, accumulator">
        </div>
      </div>
      <div class="field">
        <label for="f-url">Repo / link URL (leave blank if there's no repo)</label>
        <input id="f-url" type="url" placeholder="https://github.com/you/repo">
      </div>
      <button type="submit" class="btn btn--gold">save project →</button>
      <div class="form-status" id="status" aria-live="polite"></div>
    </form>

    <h2 class="section-title" style="font-size:28px;margin-top:40px;">Existing projects</h2>
    <div id="admin-list" class="admin-list" style="margin-top:20px;"></div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/admin.js"></script>
  </main>
</body>
</html>
