<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · Add a project</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,MONO@-15..0,400..700,0..1,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
  <script src="./js/time.js"></script>
  <style>
    .admin { max-width: 760px; margin: 0 auto; padding: 6vh 5vw; }
    .admin .field { margin-bottom: 16px; }
    .admin-list .card { margin-bottom: 16px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
    .row > .field { flex: 1; min-width: 180px; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="nav">
    <a href="./index.html" class="nav__brand">Luis Munoz, admin</a>
    <a href="./index.html" class="nav__cta">View site</a>
  </nav>

  <main id="main">

  <div class="admin">
    <div class="section__head">
      <h1 class="section-title">Add a project</h1>
      <p class="section-lead">New entries appear on the home page instantly. Paste your admin token once to unlock.</p>
    </div>

    <div class="field">
      <label for="token">Admin token</label>
      <input id="token" type="password" placeholder="ADMIN_TOKEN from your backend .env">
    </div>

    <form id="project-form" class="card">
      <input type="hidden" id="f-id">
      <div class="row">
        <div class="field">
          <label for="f-title">Title</label>
          <input id="f-title" type="text" required placeholder="Cheat Code Scanner">
        </div>
        <div class="field">
          <label for="f-meta">Meta line</label>
          <input id="f-meta" type="text" placeholder="2026 · LOG #05">
        </div>
      </div>
      <div class="field">
        <label for="f-body">Description</label>
        <textarea id="f-body" rows="3" required placeholder="What you built and the lesson that stuck."></textarea>
      </div>
      <div class="row">
        <div class="field">
          <label for="f-tools">Tools — drives the stack bars (comma-separated)</label>
          <input id="f-tools" type="text" placeholder="SQL, PostgreSQL, Python">
        </div>
        <div class="field">
          <label for="f-tags">Tags — card labels only (comma-separated)</label>
          <input id="f-tags" type="text" placeholder="loops, conditionals, accumulator">
        </div>
      </div>
      <div class="field">
        <label for="f-url">Repo / link URL (leave blank if there's no repo)</label>
        <input id="f-url" type="url" placeholder="https://github.com/you/repo">
      </div>
      <button type="submit" class="btn btn--primary">Save project</button>
      <div class="form-status" id="status"></div>
    </form>

    <h2 class="section-title" style="font-size:28px;margin-top:40px;">Existing projects</h2>
    <div id="admin-list" class="admin-list" style="margin-top:20px;"></div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/admin.js"></script>
  </main>
</body>
</html>
