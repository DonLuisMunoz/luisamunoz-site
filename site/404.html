    <title>Not found · Luis A. Munoz</title>

    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />

      rel="stylesheet"
    />
    <!-- Absolute paths, not relative: this page is served for ANY unmatched
         URL, at any depth. ./css/styles.css would 404 from /blog/nope/. -->
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
